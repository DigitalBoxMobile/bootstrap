targets:
  - name: yandex
    type: s3
    endpoint: https://storage.yandexcloud.net
    region: ru-central1
    bucket: konsierge-bootstrap
    prefix: v1/
    public_url: https://storage.yandexcloud.net/konsierge-bootstrap/v1/
    credentials: YANDEX        # BOOTSTRAP_YANDEX_ACCESS_KEY_ID, BOOTSTRAP_YANDEX_SECRET_ACCESS_KEY
  - name: selectel
    type: s3
    endpoint: https://s3.ru-7.storage.selcloud.ru
    region: ru-7
    bucket: konsierge-bootstrap
    prefix: v1/
    public_url: https://83ae1846-0a7a-4209-8c6e-84ef458fa6ce.selstorage.ru/v1/
    credentials: SELECTEL      # BOOTSTRAP_SELECTEL_ACCESS_KEY_ID, BOOTSTRAP_SELECTEL_SECRET_ACCESS_KEY
  - name: github
    type: git
    push_url: git@github.com:DigitalBoxMobile/bootstrap.git
    branch: main
    known_hosts: known_hosts   # SSH host keys of github.com, see README
    public_url: https://raw.githubusercontent.com/DigitalBoxMobile/bootstrap/main/dist/
    credentials: GITHUB        # BOOTSTRAP_GITHUB_DEPLOY_KEY: path to a private SSH deploy key with write access
