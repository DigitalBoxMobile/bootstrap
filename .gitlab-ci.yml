image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim

stages:
  - check
  - publish

variables:
  GIT_DEPTH: "0"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy

default:
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv
  before_script:
    # git for `bin/check --base` and the git mirror, ssh for pushing to it
    - command -v git >/dev/null && command -v ssh >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends git openssh-client)

.on_mr_or_master:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

test:
  stage: check
  extends: .on_mr_or_master
  script:
    - uv run --frozen pytest
    - uv run --frozen ruff check
    - uv run --frozen ruff format --check

check:
  stage: check
  extends: .on_mr_or_master
  script:
    - |
      base=""
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        base="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        base="$CI_COMMIT_BEFORE_SHA"
      fi
      if [ -n "$base" ]; then bin/check --base "$base"; else bin/check; fi

# Publishing secrets are protected, masked CI variables (see README); the
# deploy key is a File variable. Without them the targets fail with
# `missing_credentials`, which is expected until the buckets exist.
publish:dry-run:
  stage: publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - bin/publish --dry-run

publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  resource_group: publish
  script:
    - bin/publish
