[project]
name = "bootstrap"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.123",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "jwcrypto>=1.6.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
check = "bootstrap.check:main"
check-mirrors = "bootstrap.check_mirrors:main"
gen-testdata = "bootstrap.gen_testdata:main"
keygen = "bootstrap.keygen:main"
publish = "bootstrap.publish:main"
sign = "bootstrap.sign:main"
verify = "bootstrap.verify:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at bootstrap/, not src/bootstrap/
module-root = ""

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"bootstrap/gen_testdata.py" = ["E501"]
