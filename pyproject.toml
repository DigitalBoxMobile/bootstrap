[project]
name = "bootstrap"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "jsonschema>=4.26.0",
    "jwcrypto>=1.6.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"bootstrap/gen_testdata.py" = ["E501"]
